  .modulex-sayac-gosterge { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }

  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-gosterge :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-gosterge :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-gosterge :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-gosterge img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */

  .modulex-sayac-gosterge-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-gosterge-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-gosterge-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }

  .modulex-sayac-gosterge-liste { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 36px 24px; }
  .modulex-sayac-gosterge-oge { display: grid; justify-items: center; gap: 8px; text-align: center; }
  .modulex-sayac-gosterge-kadran { position: relative; width: min(100%, 240px); }
  .modulex-sayac-gosterge-kadran svg { display: block; width: 100%; height: auto; overflow: visible; }
  [dir="rtl"] .modulex-sayac-gosterge-kadran svg { transform: scaleX(-1); }
  .modulex-sayac-gosterge-cetik { fill: none; stroke: --cizgi--; stroke-width: 26; stroke-dasharray: 1.5 10.4; }
  .modulex-sayac-gosterge-iz { fill: none; stroke: color-mix(in srgb, --text-- 12%, transparent); stroke-width: 12; stroke-linecap: round; }
  .modulex-sayac-gosterge-dolu { fill: none; stroke: --accent--; stroke-width: 12; stroke-linecap: round; stroke-dasharray: 251.33; stroke-dashoffset: var(--o); transition: stroke-dashoffset 1.5s cubic-bezier(0.2, 0.8, 0.2, 1); filter: drop-shadow(0 0 6px color-mix(in srgb, --accent-- 60%, transparent)); }
  .modulex-sayac-gosterge--hazir:not(.modulex-sayac-gosterge--gor) .modulex-sayac-gosterge-dolu { stroke-dashoffset: 251.33; }
  .modulex-sayac-gosterge-kadran .modulex-sayac-gosterge-sayi { position: absolute; inset-inline: 0; inset-block-end: 0; font-size: clamp(1.7rem, 3vw, 2.3rem); font-weight: 800; font-variant-numeric: tabular-nums; }
  .modulex-sayac-gosterge-ek { color: --accentInk--; font-size: 0.6em; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-gosterge :is(.modulex-sayac-gosterge-baslik, .modulex-sayac-gosterge-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-gosterge-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sayac-gosterge { padding-inline: 16px; }

  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-gosterge *, .modulex-sayac-gosterge *::before, .modulex-sayac-gosterge *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-gosterge";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
      sayac(s, P, az);
    });
  })();
</script>
